services:
  db:
    image: postgres:16
    container_name: puzzle-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      # ICU-коллация ru-RU: корректная сортировка русских названий
      # в фильтрах. Локали ru_RU.utf8 в образе нет — только ICU.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU --encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
